[project]
name = "clipgen"
version = "0.1.0"
description = "Minimal local pipeline: long-form video -> transcript -> Gemini -> a ranked list of clip moments, driven from a small web UI."
requires-python = ">=3.11,<3.12"
dependencies = [
    "yt-dlp>=2026.6.9",
    "whisperx==3.8.5",
    "torch>=2.7,<2.9",
    "torchaudio>=2.7,<2.9",
    "soundfile>=0.14.0",
    "google-genai>=2.10.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
